name: Barkeep
options:
  bundleIdPrefix: com.samuelphifer
  deploymentTarget:
    macOS: "14.0"
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Barkeep:
    type: application
    platform: macOS
    sources:
      - path: Barkeep
        excludes:
          - Info.plist
          - AppIcon.icon
      - path: Barkeep/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Barkeep/Info.plist
      properties:
        CFBundleDisplayName: Barkeep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samuelphifer.Barkeep
      PRODUCT_NAME: Barkeep
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9N867BCJ32
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BarkeepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BarkeepTests
    dependencies:
      - target: Barkeep
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.samuelphifer.BarkeepTests
      DEVELOPMENT_TEAM: 9N867BCJ32
schemes:
  Barkeep:
    build:
      targets:
        Barkeep: all
        BarkeepTests: [test]
    test:
      targets:
        - BarkeepTests
